<style>
:root{--bg:#eef2f8;--card:#fff;--ink:#0d1b33;--sub:#5b6b86;--main:#13315c;--line:#d5deec;--chip:#fff;--chipon:#13315c;--chipink:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1424;--card:#13203a;--ink:#e8eefb;--sub:#97a7c4;--main:#8fb4ff;--line:#26385c;--chip:#13203a;--chipon:#8fb4ff;--chipink:#0b1424;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1424;--card:#13203a;--ink:#e8eefb;--sub:#97a7c4;--main:#8fb4ff;--line:#26385c;--chip:#13203a;--chipon:#8fb4ff;--chipink:#0b1424;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.7}
.wrap{max-width:1080px;margin:0 auto;padding:32px 20px 64px}
h1{font-size:clamp(30px,5vw,44px);font-weight:900;color:#000;margin:0 0 20px;letter-spacing:.02em}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h1{color:#fff}}
:root[data-theme="dark"] h1{color:#fff}
.search{width:100%;font:inherit;font-size:17px;padding:15px 20px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
.search:focus,.chip:focus-visible,.card:focus-visible{outline:3px solid var(--main);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 8px}
.chip{font:inherit;font-size:15px;padding:7px 18px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.chip.on{background:var(--chipon);color:var(--chipink);border-color:var(--chipon)}
h2{font-size:22px;color:var(--main);margin:34px 0 14px;padding-bottom:8px;border-bottom:2px solid var(--main)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;cursor:pointer}
.card h3{margin:0 0 2px;font-size:19px}
.alias{font-size:13px;color:var(--sub);margin-bottom:6px}
.sum{margin:0;font-size:15px}
.pill{display:inline-block;background:var(--chipon);color:var(--chipink);font-size:12px;line-height:1.5;padding:1px 9px;border-radius:999px;margin-right:6px}.sec{font-size:17px;margin:20px 0 10px;padding-left:10px;border-left:4px solid var(--main)}.grp{font-size:13px;color:var(--sub);margin-bottom:4px}.more{white-space:pre-wrap;display:none;margin:12px 0 0;padding-top:12px;border-top:1px dashed var(--line);font-size:15px;color:var(--sub)}
.card.open .more{display:block}
.card.open{border-color:var(--main)}
.empty{padding:40px 0;text-align:center;color:var(--sub)}
@media (max-width:860px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.grid{grid-template-columns:1fr}.wrap{padding:24px 16px 48px}}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin:0 -20px;padding:12px 20px 10px;border-bottom:1px solid var(--line)}
.chips{flex-wrap:nowrap;overflow-x:auto;margin:12px 0 0;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;white-space:nowrap}
/* 分類左右滑動：兩側漸層提示＋箭頭鈕（桌機可拖曳、滾輪橫移） */
.cs{position:relative;margin:12px 0 0}.cs .chips{margin:0;scroll-behavior:smooth;overscroll-behavior-x:contain;cursor:grab}
.cs .chips.drag{cursor:grabbing;scroll-behavior:auto;user-select:none}.cs .chips.drag .chip{pointer-events:none}
.cs::before,.cs::after{content:"";position:absolute;top:0;bottom:4px;width:56px;pointer-events:none;z-index:1;opacity:0;transition:opacity .2s}
.cs::before{left:0;background:linear-gradient(to right,var(--bg) 35%,transparent)}.cs::after{right:0;background:linear-gradient(to left,var(--bg) 35%,transparent)}
.cs.sl::before,.cs.sr::after{opacity:1}
.ca{position:absolute;top:calc(50% - 2px);transform:translateY(-50%);z-index:2;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--main);cursor:pointer;display:grid;place-items:center;padding:0;box-shadow:0 1px 6px rgba(0,0,0,.12)}
.ca[hidden]{display:none}.ca.l{left:0}.ca.r{right:0}.ca:focus-visible{outline:3px solid var(--main);outline-offset:2px}
@media (hover:none) and (pointer:coarse){.ca{display:none!important}}
@media (prefers-reduced-motion:reduce){.cs .chips{scroll-behavior:auto}.cs::before,.cs::after{transition:none}}
@media (max-width:560px){.bar{margin:0 -16px;padding:10px 16px 8px}}
h2{font-size:24px;font-weight:800;margin:40px 0 14px;scroll-margin-top:120px}
.sec{font-size:16px;font-weight:700;margin:22px 0 10px;scroll-margin-top:120px}
.card:not(.xp){cursor:default}
.card h3{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px;padding-right:22px}
.code{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;background:color-mix(in srgb,var(--main) 14%,transparent);color:var(--main);border-radius:6px;padding:1px 7px;line-height:1.6}
.pill.dup{background:transparent;color:var(--sub);border:1px solid var(--line)}
.al{font-size:13px}
.card.xp{position:relative;transition:border-color .15s}
.card.xp:hover{border-color:var(--main)}
.card.xp::after{content:"";position:absolute;top:22px;right:18px;width:7px;height:7px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:rotate(45deg);transition:transform .25s,top .25s}
.card.xp.open::after{transform:rotate(-135deg);top:26px}
.mw{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}
.card.open .mw{grid-template-rows:1fr}
.mi{overflow:hidden;min-height:0}
.det{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:grid;gap:7px;font-size:14.5px;color:var(--ink)}
.kv{display:flex;gap:10px;align-items:baseline}
.kv b{flex:none;font-size:12.5px;font-weight:600;color:var(--main);background:color-mix(in srgb,var(--main) 12%,transparent);border-radius:6px;padding:0 8px}
.ex{display:flex;gap:10px;background:color-mix(in srgb,var(--main) 8%,transparent);border-radius:10px;padding:8px 12px}
.ex b{flex:none;color:var(--main)}
.ln,.kv span,.ex span{white-space:pre-line}
@media (prefers-reduced-motion:reduce){.mw,.card.xp::after{transition:none}}

:root{--c0:#4f86c6;--c1:#2f9e96;--c2:#8a79d1;--c3:#3aa0cf;--c4:#d2708a;--c5:#d39a32;--c6:#e07a4f;--c7:#c4604a;--c8:#4fa070;--c9:#7b8cab;--warn:#a8680f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--warn:#e9b866;--bg:#0a1222;--card:#172a49;--line:#2a4166}}
:root[data-theme="dark"]{--warn:#e9b866;--bg:#0a1222;--card:#172a49;--line:#2a4166}
.wrap{max-width:1200px}
h1{display:flex;align-items:center;gap:14px;font-size:clamp(34px,6vw,52px);margin:8px 0 28px;line-height:1.2}
.logo{flex:none;color:var(--main);width:clamp(34px,5vw,48px);height:auto}
.sw{position:relative}
.search{padding:16px 48px 16px 52px;font-size:17px;-webkit-appearance:none;appearance:none}
.search::-webkit-search-cancel-button{display:none}
.ico{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--sub);pointer-events:none}
.clr{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:50%;background:color-mix(in srgb,var(--sub) 20%,transparent);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.clr[hidden],.top[hidden]{display:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:7px}
h2{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:26px;border-bottom:2px solid var(--acc,var(--main));padding-bottom:10px;margin:48px 0 16px}
h2::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--acc,var(--main))}
.sec{border-left:4px solid var(--acc,var(--main));padding-left:10px;margin:24px 0 12px}
.grid{gap:16px}
.card{border-top:3px solid var(--acc,var(--line));padding:24px;min-height:128px}
.card.open,.card.xp:hover{border-top-color:var(--acc,var(--main))}
.card h3{font-weight:700;font-size:19px;line-height:1.45;margin-bottom:4px}
.alias{margin:6px 0 8px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.pill{margin-right:0;font-size:13px}
.code,.kv b{font-size:13px;background:color-mix(in srgb,var(--sub) 18%,transparent);color:var(--ink)}
.sum{font-size:15px;line-height:1.65;color:color-mix(in srgb,var(--ink) 78%,var(--bg))}
.card.xp:not(.open) .sum{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ex{background:color-mix(in srgb,#d39a32 15%,transparent)}
.ex b{color:var(--warn)}
mark{background:color-mix(in srgb,#f2c94c 55%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.empty{display:flex;flex-direction:column;align-items:center;gap:14px;padding:64px 0}
.empty svg{color:var(--sub);opacity:.6}
.empty p{margin:0}
.fade{animation:fin .28s ease}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--main);cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top:focus-visible,.clr:focus-visible{outline:3px solid var(--main);outline-offset:2px}
@media (max-width:560px){.card{padding:20px}h2{font-size:23px}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}

.wrap{position:relative}
h1{padding-right:56px}
.theme{position:absolute;top:30px;right:20px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.th{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer;display:flex;align-items:baseline;flex-wrap:wrap;gap:6px;width:100%}
.th:focus-visible,.lnk:focus-visible,.cp:focus-visible,.theme:focus-visible{outline:3px solid var(--main);outline-offset:2px;border-radius:6px}
.mi{visibility:hidden;transition:visibility 0s .25s}
.card.open .mi{visibility:visible;transition-delay:0s}
.card{padding-bottom:44px}
.cp{position:absolute;right:12px;bottom:8px;width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:var(--sub);cursor:pointer;display:grid;place-items:center;opacity:.6}
.card:hover .cp,.cp:focus-visible{opacity:1}
.tools{display:flex;justify-content:space-between;align-items:center;margin-top:14px;min-height:34px}
.count{font-size:14px;color:var(--sub)}
.lnk{font:inherit;font-size:14px;color:var(--main);background:none;border:1px solid var(--line);border-radius:999px;padding:4px 14px;cursor:pointer}
.lnk[aria-pressed="true"]{background:var(--chipon);color:var(--chipink);border-color:var(--chipon)}
.foot{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);font-size:14px;color:var(--sub);text-align:center}.foot a{color:var(--main);font-weight:500}
.foot p{margin:4px 0}
.fw{display:inline-block;width:1em;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.toast.on{opacity:1}
.flash{animation:fl 1.8s ease}
@keyframes fl{0%,60%{box-shadow:0 0 0 3px var(--main)}100%{box-shadow:0 0 0 3px transparent}}
@supports not (color:color-mix(in srgb,red,blue)){.code,.kv b,.clr{background:rgba(120,130,150,.2)}.ex{background:rgba(211,154,50,.15)}mark{background:#f6df8a}.sum{color:var(--sub)}}
@media print{:root{--bg:#fff;--card:#fff;--ink:#000;--sub:#444;--line:#bbb}body::before,.bar,.ca,.top,.theme,.tools,.cp,.toast{display:none!important}.wrap{max-width:none;padding:0}.grid{grid-template-columns:repeat(2,1fr)}.card{break-inside:avoid}.mw{grid-template-rows:1fr!important}.mi{visibility:visible!important}.card.xp::after{display:none}.card.xp:not(.open) .sum{display:block}h2,.sec{break-after:avoid}}
:root{--c0:#3f78b8;--c1:#2a8f88;--c2:#7c6bc4;--c3:#2b8fbd;--c4:#c25a76;--c5:#b07d1a;--c6:#d06a3d;--c7:#b8513c;--c8:#3f8d5e;--c9:#6a7b9c;--warn:#8a5200}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c0:#4f86c6;--c1:#2f9e96;--c2:#8a79d1;--c3:#3aa0cf;--c4:#d2708a;--c5:#d39a32;--c6:#e07a4f;--c7:#c4604a;--c8:#4fa070;--c9:#7b8cab}}
:root[data-theme="dark"]{--c0:#4f86c6;--c1:#2f9e96;--c2:#8a79d1;--c3:#3aa0cf;--c4:#d2708a;--c5:#d39a32;--c6:#e07a4f;--c7:#c4604a;--c8:#4fa070;--c9:#7b8cab}
.cp{opacity:.85}
.card:hover .cp,.cp:focus-visible{opacity:1}
</style>

li><li><strong>火災基本保險</strong>：住家因失火或爆炸等事故導致建築物需重建時啟動；有房貸時政府強制投保</li><li><strong>地震基本保險</strong>：保障建築物本體不含動產及裝潢；毀損需達全損或半倒不堪居住時啟動；有房貸時政府強制投保</li><li><strong>擴大地震險</strong>：增加『保障範圍』，含動產、牆壁龜裂等</li><li><strong>超額地震險</strong>：增加『保障額度』</li><li><strong>火災第三人責任險</strong>：保障因火災延燒導致需要賠償第三人的責任</li><li><strong>商業火災險</strong>：保障公司、工廠、店家..等，因火災、爆炸、雷擊…等事故導致財產或設備等損失</li><li><strong>營業中斷險</strong>：因火災導致停工，補助停工期間無法營業的損失</li><li><strong>爆炸險</strong>：因爆炸導致損失時啟動</li><li><strong>水漬險</strong>：因供水設備滲漏或管線溢水導致損失時啟動</li><li><strong>煙燻險</strong>：因火災產生的煙燻造成損失時啟動</li><li><strong>航空器墜落、機動車輛碰撞險</strong>：因飛機掉落或汽機車衝撞導致損失啟動</li><li><strong>罷工、暴動、民眾騷擾、惡意破壞行為險</strong>：因罷工、暴動、惡意破壞砸店等行為造成損失時啟動</li><li><strong>公共意外責任險</strong>：保障特定場所或活動對第三人造成事故的責任</li><li><strong>產品責任險</strong>：保障因商品瑕疵造成消費者受傷的責任</li><li><strong>雇主補償責任保險</strong>：依照『勞基法』規定，保障員工受傷時雇主需依勞基法補償義務的責任</li><li><strong>雇主意外責任險</strong>：依照『民法』規定，保障員工受傷時雇主需依民事賠償的責任</li><li><strong>醫師業務責任保險</strong>：保障醫師因醫療疏失需賠償的責任</li><li><strong>醫護人員責任保險</strong>：保障醫護人員因醫療疏失需賠償的責任</li><li><strong>醫療機構責任保險</strong>：保障診所或醫院因醫療疏失需賠償的責任</li><li><strong>工程險</strong>：（內容建置中）</li><li><strong>水險/運輸險</strong>：（內容建置中）</li><li><strong>新護身符</strong>：機車險專案</li><li><strong>乘意加倍</strong>：汽車險專案</li><li><strong>逐電踏實</strong>：汽車電動車專案</li><li><strong>新快樂旅粽</strong>：法人、團體適用</li><li><strong>快樂旅平卡/公教旅平卡</strong>：個人、家庭旅遊適用；加退保變更可線上操作</li><li><strong>一期逐夢</strong>：留學及出差＞180天適用；可附加自動續約</li><li><strong>精彩人生</strong>：可搭配快樂旅粽投保；特定活動國內外皆適用</li><li><strong>十全兒童</strong>：0～14歲兒童意外險；可加意外實支＆罹癌一次金</li><li><strong>十全大補（一般型）</strong>：15～75歲意外險；可加意外實支；職業等級限1～3級</li><li><strong>十全大補（勞安型）</strong>：15～75歲意外險；可加意外實支；職業等級限4～5級</li><li><strong>璀璨人生</strong>：40～85歲長輩意外險；意外實支額度高</li><li><strong>愛藥即時</strong>：0～75歲癌症險；給付達文西手術、標靶治療；可加罹癌一次金</li><li><strong>健康守護加</strong>：0～75歲健康險；定額給付住院、手術及特定疾病實支</li><li><strong>富貴傳家</strong>：可加超額地震險；房東適用</li><li><strong>闔家平安</strong>：含家責險；單純保動產，保額最高；建築物可加保其他火險專案；房東＆租屋族適用</li><li><strong>新寶貝家</strong>：含家責險；可加擴大地震險＆超額颱風洪水險</li><li><strong>五路財神甲式</strong>：Ａ餐、Ｂ餐、Ｃ餐、Ｄ餐</li><li><strong>好頭家</strong>：員工5人以上（不含負責人）</li><li><strong>謝老闆</strong>：員工1人以上（不含負責人）</li><li><strong>安心食樂（食品責任險）</strong>：政府強制食品業者投保</li><li><strong>活力四射（公共意外責任險）</strong>：特定活動可投保，固定額度方案可自選；非專案額度可另外M+報價，費率較優勢</li><li><strong>長照機構專責險</strong>：承保對象：居家式、社區式、機構式長照機構</li><li><strong>醫療專業責任險</strong>：承保對象：醫師、醫院、診所</li><li><strong>護理人員責任險</strong>：承保對象：護理人員</li></ul></noscript><!--NOSCRIPT_END-->

險","a":[],"c":"通用名詞","g":"保額＆價值","s":"保額 ＝ 價值","d":"・例：價值100萬，保額100萬","id":"t-018"},{"n":"超額保險","a":[],"c":"通用名詞","g":"保額＆價值","s":"保額 ＞ 可保價值","d":"・例：價值100萬，保額200萬","id":"t-019"},{"n":"不足額保險","a":[],"c":"通用名詞","g":"保額＆價值","s":"保額 ＜ 可保價值","d":"・例：價值100萬，保額50萬","id":"t-020"},{"n":"比例分攤","a":[],"c":"通用名詞","g":"保額＆價值","s":"投保不足額或雙方各自有責任時，按照比例計算賠款","d":"・例：價值100萬，保額50萬\n　實際損失100萬 × 50% ＝ 實際理賠金50萬","id":"t-021"},{"n":"註銷","a":[],"c":"通用名詞","g":"契約異動＆批改","s":"保期開始前撤銷保單，退還全部保費","d":"","id":"t-022"},{"n":"退保","a":[],"c":"通用名詞","g":"契約異動＆批改","s":"保期中終止契約，退還剩餘沒用到的保費","d":"","id":"t-023"},{"n":"按日比例退費","a":[],"c":"通用名詞","g":"退費規則","s":"按日計算退費","d":"・個人險：僅身故件、車輛報廢\n・企業險：員工團險（好頭家）\n・保費 × 剩餘天數 ÷ 365 ＝ 退費金額","id":"t-024"},{"n":"短期費率退費","a":[],"c":"通用名詞","g":"退費規則","s":"按短期費率表計算退費金額","d":"・健康傷害險、車險\n・保費 × 短期費率 ＝ 退費金額","id":"t-025"},{"n":"03 自用小客車（自然人 / 法人）","a":[],"c":"汽車險","g":"車種分類與代碼","s":"車種分類與代碼","d":"","sec":"車種","id":"t-026"},{"n":"22 自用小客貨（自然人 / 法人）","a":[],"c":"汽車險","g":"車種分類與代碼","s":"車種分類與代碼","d":"","sec":"車種","id":"t-027"},{"n":"04 自用小貨車（自然人）","a":[],"c":"汽車險","g":"車種分類與代碼","s":"車種分類與代碼","d":"","sec":"車種","id":"t-028"},{"n":"19 公司自小貨（法人）","a":[],"c":"汽車險","g":"車種分類與代碼","s":"車種分類與代碼","d":"","sec":"車種","id":"t-029"},{"n":"15 個人小客車（營業小客車 / 合作社計程車/小黃）","a":[],"c":"汽車險","g":"車種分類與代碼","s":"車種分類與代碼","d":"","sec":"車種","id":"t-030"},{"n":"21 強制汽車責任保險","a":[],"c":"汽車險","g":"責任險與超額險","s":"政府強制投保","d":"・理賠對象：我方乘客、第三人\n・理賠項目：醫藥費、失能、身故…","sec":"汽車險種","id":"t-031"},{"n":"31.32 第三人責任險（傷害.財損）","a":[],"c":"汽車險","g":"責任險與超額險","s":"有責任賠償第三人時啟動","d":"・理賠對象：第三人\n・理賠項目：財產損失、醫藥傷殘","sec":"汽車險種","id":"t-032"},{"n":"30B1 超額責任保險 乙式（每一事故）","a":[],"c":"汽車險","g":"責任險與超額險","s":"第三人責任險額度不夠賠付時啟動","d":"・理賠對象：第三人（包含對方駕駛、對方乘客、行人）\n・理賠項目：財產損失、醫藥傷殘","sec":"汽車險種","id":"t-033"},{"n":"51C1 乘客體傷責任保險","a":[],"c":"汽車險","g":"責任險與超額險","s":"有責任賠償乘客時啟動","d":"・理賠對象：我方乘客\n・理賠項目：醫藥傷殘","sec":"汽車險種","id":"t-034"},{"n":"33 失能責任增額附加條款","a":[],"c":"汽車險","g":"責任險與超額險","s":"對方失能時依失能等級加碼賠償","d":"・理賠對象：第三人（包含對方駕駛、對方乘客、行人）\n・理賠項目：失能 <script>
/* ============ 程式區（一般不需修改）；資料在上方 glossary-data 區塊 ============ */
const RAWD=JSON.parse(document.getElementById("glossary-data").textContent);
const CATS=RAWD.cats;
const DATA=RAWD.data.filter(x=>{const ok=x&&x.id&&x.n&&x.s!==undefined&&CATS.includes(x.c);if(!ok)console.warn("資料格式有誤，已略過：",x);return ok});
const UPDATED="2026年11月1日";
/* 網址代稱與輔助色依「分類名稱」對應，調整分類順序不影響連結與顏色 */
const SL={"通用名詞":"general","汽車險":"car","機車險":"moto","旅平險":"travel","健康傷害險":"health","責任險":"liability","住火險":"home-fire","商業火險":"biz-fire","工程水險":"eng-marine","商品專區":"products"};
const CC={"通用名詞":0,"汽車險":1,"機車險":2,"旅平險":3,"健康傷害險":4,"責任險":5,"住火險":6,"商業火險":7,"工程水險":8,"商品專區":9};
const SYN={"家責險":"家庭日常生活責任險","個責險":"個人責任保險","雇責險":"雇主意外責任險","雇補險":"雇主補償責任保險","車損險":"車體損失險"};
const $=s=>document.querySelector(s);
let cat="全部",K="",allOpen=false;
const esc=t=>String(t).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])).replace(/＆/g,'<span class="fw">＆</span>');
const RX=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function hl(t){if(!K)return esc(t);return t.split(new RegExp("("+RX(K)+")","gi")).map((p,i)=>i%2?`<mark>${esc(p)}</mark>`:esc(p)).join("")}
const acc=c=>`--acc:var(--c${CC[c]??9})`;
function chips(){
  const all=[["全部",DATA.length]].concat(CATS.map(c=>[c,DATA.filter(x=>x.c===c).length]));
  $("#chips").innerHTML=all.filter(x=>x[1]>0).map(([c,k])=>`<button class="chip${c===cat?" on":""}" aria-pressed="${c===cat}" data-c="${esc(c)}">${c==="全部"?"":`<i class="dot" style="${acc(c)}"></i>`}${esc(c)} (${k})</button>`).join("");
  requestAnimationFrame(edges);
}
function nm(n){const m=n.match(/^((?=[0-9A-Z.\/]*[0-9])[0-9A-Z.\/]{1,8})\s+(.+)$/);return m?`<span class="code">${hl(m[1])}</span><span>${hl(m[2])}</span>`:hl(n)}
const KV=/^(理賠對象|理賠項目|承保範圍|自負額|啟動時間點|投保限制|保障範圍|保障項目|服務項目|加值選|承保對象)：([\s\S]*)$/;
function det(d){
  const it=[];
  d.split("\n").forEach(l=>{const m=l.match(/^(\u3000*)・([\s\S]*)$/);if(m)it.push({dep:m[1].length,t:m[2]});else if(it.length)it[it.length-1].t+="\n"+l.replace(/^\u3000+/,"")});
  return it.map(o=>{const pad=`style="margin-left:${o.dep*14}px"`;let m;
    if(o.t.startsWith("例："))return `<div class="ex" ${pad}><b>例</b><span>${hl(o.t.slice(2))}</span></div>`;
    if(m=o.t.match(KV))return `<div class="kv" ${pad}><b>${hl(m[1])}</b><span>${hl(m[2])}</span></div>`;
    return `<div class="ln" ${pad}>${hl(o.t)}</div>`}).join("");
}
const hay=x=>[x.n,(x.a||[]).join(" "),x.g||"",x.s,x.d||""].join(" ").toLowerCase();
function card(x){
  const xp=!!x.d,k=K.toLowerCase(),alt=(SYN[K]||"").toLowerCase();
  const head=[x.n,x.g||"",(x.a||[]).join(" "),x.s].join(" ").toLowerCase();
  const open=xp&&(allOpen||(k&&!head.includes(k)&&!(alt&&head.includes(alt))&&x.d.toLowerCase().includes(k)));
  const meta=(x.g?`<span class="pill">${hl(x.g)}</span>`:"")+(x.a&&x.a.length?`<span class="al">別名：${hl(x.a.join("、"))}</span>`:"");
  const name=xp?`<button class="th" aria-expanded="${!!open}" aria-controls="d-${x.id}">${nm(x.n)}</button>`:nm(x.n);
  return `<article id="${x.id}" class="card${xp?" xp":""}${open?" open":""}" style="${acc(x.c)}"><h3>${name}</h3>${meta?`<div class="alias">${meta}</div>`:""}<p class="sum">${hl(x.s)}</p>${xp?`<div class="mw"><div class="mi" id="d-${x.id}"><div class="det">${det(x.d)}</div></div></div>`:""}<button class="cp" data-id="${x.id}" aria-label="複製連結：${x.n}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg></button></article>`;
}
function score(x,k){const t=s=>String(s).toLowerCase().includes(k);return t(x.n)?0:(t(x.g||"")||t((x.a||[]).join(" ")))?1:t(x.s)?2:3}
function render(){
  K=$("#q").value.trim();const k=K.toLowerCase(),alt=(SYN[K]||"").toLowerCase();
  $("#clr").hidden=!K;
  let list=DATA.filter(x=>(cat==="全部"||x.c===cat)&&(!k||hay(x).includes(k)||(alt&&hay(x).includes(alt))));
  if(k)list=list.map((x,i)=>[x,score(x,k),i]).sort((a,b)=>a[1]-b[1]||a[2]-b[2]).map(a=>a[0]);
  $("#live").textContent=(k?"共找到 ":"共 ")+list.length+" 筆";
  if(!list.length){$("#out").innerHTML='<div class="empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><p>找不到符合的名詞，換個關鍵字試試。</p><button class="chip" id="rst">清除搜尋</button></div>';return}
  $("#out").innerHTML=CATS.map(c=>{const g=list.filter(x=>x.c===c);return g.length?`<h2 style="${acc(c)}">${esc(c)}</h2>`+[...new Set(g.map(x=>x.sec||""))].map(s=>(s?`<h3 class="sec" style="${acc(c)}">${esc(s)}</h3>`:"")+`<div class="grid">${g.filter(x=>(x.sec||"")===s).map(card).join("")}</div>`).join(""):""}).join("");
}
function setOpen(c,o){c.classList.toggle("open",o);const b=c.querySelector(".th");b&&b.setAttribute("aria-expanded",o)}
function fade(){const o=$("#out");o.classList.remove("fade");void o.offsetWidth;o.classList.add("fade")}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800)}
async function copy(id){const u=location.href.split("#")[0]+"#"+id;try{await navigator.clipboard.writeText(u);toast("已複製連結")}catch(e){location.hash=id;toast("請從網址列複製連結")}}
function route(first){
  const h=location.hash.slice(1);let c="全部",t=null;
  if(h.startsWith("cat-")){const f=CATS.find(x=>SL[x]===h.slice(4));if(f)c=f}
  else if(/^t-\d+$/.test(h)){const x=DATA.find(x=>x.id===h);if(x){c=x.c;t=h}}
  const changed=c!==cat;cat=c;chips();render();
  if(t){const el=document.getElementById(t);if(el){if(el.classList.contains("xp"))setOpen(el,true);el.scrollIntoView({block:"center"});el.classList.add("flash")}}
  else if(!first&&changed){scrollTo(0,0);fade();const on=$("#chips .on");on&&on.scrollIntoView({inline:"center",block:"nearest"})}
}
/* 分類列左右滑動 */
const CH=$("#chips"),CS=$("#cs");
function edges(){const m=CH.scrollWidth-CH.clientWidth,x=CH.scrollLeft,l=x>2,r=x<m-2;CS.classList.toggle("sl",l);CS.classList.toggle("sr",r);$("#cal").hidden=!l;$("#car").hidden=!r}
CH.addEventListener("scroll",edges,{passive:true});addEventListener("resize",edges);
$("#cal").addEventListener("click",()=>CH.scrollBy({left:-CH.clientWidth*.7}));
$("#car").addEventListener("click",()=>CH.scrollBy({left:CH.clientWidth*.7}));
CH.addEventListener("wheel",e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&CH.scrollWidth>CH.clientWidth){const m=CH.scrollWidth-CH.clientWidth,x=CH.scrollLeft;if((e.deltaY<0&&x>0)||(e.deltaY>0&&x<m)){e.preventDefault();CH.scrollLeft+=e.deltaY}}},{passive:false});
let dg=null;
CH.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse"||e.button!==0)return;dg={x:e.clientX,s:CH.scrollLeft,m:false}});
addEventListener("pointermove",e=>{if(!dg)return;const d=e.clientX-dg.x;if(!dg.m&&Math.abs(d)>5){dg.m=true;CH.classList.add("drag")}if(dg.m)CH.scrollLeft=dg.s-d});
addEventListener("pointerup",()=>{if(!dg)return;const m=dg.m;dg=null;if(m)CH.classList.remove("drag")});
CH.addEventListener("focusin",e=>{const b=e.target.closest(".chip");b&&b.scrollIntoView({inline:"nearest",block:"nearest"})});
const TN=["跟隨系統","深色","淺色"],TV=["","dark","light"];
function theme(i){const r=document.documentElement;TV[i]?r.setAttribute("data-theme",TV[i]):r.removeAttribute("data-theme");$("#theme").setAttribute("aria-label","切換淺色／深色模式：目前"+TN[i]);try{localStorage.setItem("th",i)}catch(e){}}
let ti=0;try{ti=+localStorage.getItem("th")||0}catch(e){}
let tm,comp=false;
$("#q").addEventListener("input",()=>{if(comp)return;clearTimeout(tm);tm=setTimeout(render,120)});
$("#q").addEventListener("compositionstart",()=>{comp=true});
$("#q").addEventListener("compositionend",()=>{comp=false;clearTimeout(tm);tm=setTimeout(render,0)});
$("#clr").addEventListener("click",()=>{$("#q").value="";render();$("#q").focus()});
$("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;const c=b.dataset.c;location.hash=c==="全部"?"all":"cat-"+SL[c]});
$("#out").addEventListener("click",e=>{
  if(e.target.id==="rst"){$("#q").value="";render();return}
  const cp=e.target.closest(".cp");if(cp){copy(cp.dataset.id);return}
  const c=e.target.closest(".card.xp");if(c)setOpen(c,!c.classList.contains("open"));
});
$("#exp").addEventListener("click",()=>{allOpen=!allOpen;$("#exp").textContent=allOpen?"全部收合":"全部展開";$("#exp").setAttribute("aria-pressed",allOpen);render()});
$("#theme").addEventListener("click",()=>{ti=(ti+1)%3;theme(ti)});
$("#top").addEventListener("click",()=>scrollTo({top:0,behavior:"smooth"}));
addEventListener("scroll",()=>{$("#top").hidden=scrollY<600},{passive:true});
addEventListener("hashchange",()=>route(false));
$("#upd").textContent=UPDATED;
theme(ti);route(true);
</script>
</body>
</html>

# 推送到 main 分支時：檢查資料 → 只把網站需要的檔案部署到 GitHub Pages
# （docs/、data.csv 等不會公開在網站上；ubuntu-latest 內建 python3，不需另外安裝）
name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 檢查資料與頁面是否為最新
        run: python3 build.py --check

      - name: 組合網站檔案
        run: |
          mkdir _site
          for f in index.html favicon.svg apple-touch-icon.png og.png robots.txt sitemap.xml; do
            if [ -f "$f" ]; then cp "$f" _site/; fi
          done
          ls -la _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
